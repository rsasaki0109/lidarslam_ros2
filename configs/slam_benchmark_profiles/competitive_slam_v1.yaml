    partitions:
      historical: regression
      fresh: primary_fresh
    repetitions: 3
    minimum_aggregate_ape_improvement_percent: 10.0
    maximum_processing_rtf: 1.0
    maximum_online_compute_rtf: 1.0
    online_phase_contract:
      version: m6a10-online-compute-v1
      schema_version: 1
      primary_metric: runtime.online_compute_rtf
      wall_metric: runtime.wall_realtime_factor
      wall_metric_role: diagnostic_only
      coverage_proof_modes:
        - trajectory_timestamp_coverage
        - processed_message_counts
      require_zero_dropped_messages: true
      require_zero_queue_overflow: true
      exclude:
        - container_startup
        - map_save
        - postprocess
        - fixed_shutdown_grace
    online_phase_contract_v2:
      version: m6a10-online-compute-v2
      schema_version: 2
      primary_modes: [paced_1x, unpaced_ack]
      paced_primary_metric: runtime.paced_followability_passed
      unpaced_primary_metric: runtime.unpaced_throughput_gate_passed
      maximum_unpaced_throughput_rtf: 1.0
      maximum_timestamp_end_gap_seconds: 0.25
      maximum_callback_latency_seconds: 0.25
      maximum_backlog_messages: 0
      require_exact_consumer_counts: true
      require_eof_observed: true
      require_zero_dropped_messages: true
      require_zero_queue_overflow: true
      require_ack_backpressure_for_unpaced: true
      publisher_counts_are_not_consumer_acks: true
      wall_metric_role: diagnostic_only
    maximum_primary_regression_percent: 2.0
    maximum_peak_rss_ratio_to_rival: *max_peak_rss_ratio
    maximum_mapping_regression_percent: 2.0
    minimum_fresh_holdout_slots: 3
    require_fresh_holdout: true
    thread_policy_required_keys:
      - cpu_affinity
      - max_threads
      - omp_num_threads
      - openblas_num_threads
      - mkl_num_threads
      - tbb_num_threads
      - accelerator_policy
    bootstrap_method: fixed_seed_hierarchical_dataset_cluster_bootstrap
    bootstrap_seed: 20260821
    bootstrap_samples: 10000
    common_identity_fields:
      - input_sha256
      - reference_sha256
      - calibration_sha256
      - machine_id
      - hardware_fingerprint
      - thread_policy
      - release
      - scorer_fingerprint
    pinned_identity_fields:
      - revision
      - container_digest
      - toolchain_fingerprint
      - config_sha256
    execution_selection_receipt_path: configs/slam_benchmark_profiles/competitive_execution_selection_2026-08.yaml
