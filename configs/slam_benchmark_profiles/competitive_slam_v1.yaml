    # Resource evidence is a separate identity gate from the runtime metric.
    # One canonical ratio is used for the aggregate best-rival comparison,
    # every pinned rival, and each sequence; no RSS threshold is invented.
    memory_gate:
      schema_version: 1
      status: READY
      source_kind: benchmark_process_rss_authoritative_v1
      measurement_version: m6a7-container-memory-v2
      measurement_scope: container_cgroup_v2_with_pid_rss
      primary_metric: aggregate_process_tree_peak_rss_bytes
      primary_metric_definition: sum_of_per_process_vmrss_peaks_shared_pages_may_be_recounted
      max_peak_rss_ratio_vs_best_rival: *max_peak_rss_ratio
      minimum_matched_complete_runs: 3
      aggregate:
        rival_selection: best_rival
        compare_every_pinned_rival: true
        threshold_source: max_peak_rss_ratio_vs_best_rival
        aggregation: max_peak_over_repetitions_and_sequences_v1
      per_sequence:
        status: READY
        serious_regression_ceiling_ratio: *max_peak_rss_ratio
        threshold_source: max_peak_rss_ratio_vs_best_rival
      uncertainty:
        status: NOT_APPLICABLE
        required: false
        scope: APE_ONLY
        rss_ci_claim: false
        method: null
        reason: 95% bootstrap/CI is required for APE only; RSS uses deterministic maxima
      resource_identity:
        required_fields:
          - tool_revision
          - sampler_script_sha256
          - memory_helper_script_sha256
          - config_sha256
          - thread_policy_sha256
          - hardware_fingerprint
          - machine_id
          - release
        tool_revision: m6a7-container-process-rss-v1
        sampler_script_path: scripts/sample_container_process_rss.py
        sampler_script_sha256: b8ad4c0d016710a17349773df0e115ca7a6c2bc1fce2054c77d9991c61bb11ee
        memory_helper_script_path: scripts/container_memory_evidence.py
        memory_helper_script_sha256: f526cd3e526d870982ccf12657e09397f6b048c0b446c5b57b9e5c63433ef9cf
        gate_script_path: scripts/competitive_memory_gate.py
        gate_script_sha256: ec4e316f33acd253565fef7ccbbaa04401be87b9d21c575018871b0ea0f2ac04
      forbidden_source_kinds:
        - registration-plugin-functional-resource-policy-v1
        - functional_non_authoritative_v1
        - non_authoritative_contaminated
    # Fresh-holdout authorization is a separate claim gate.  The current
    # campaign has no independent custodian signature, so this remains
    # NOT_READY and cannot be promoted by a runner/scorer receipt.
    fresh_holdout_authorization:
      schema_version: 1
      required: true
      status: NOT_READY
      status_reason: independent_external_custodian_attestation_absent
      required_chain_kinds:
        - precommit
        - holdout_seal
        - replay_authorization
        - leakage_audit
        - failure_record
      receipt_hash_kind: canonical_authorization_receipt_sha256_v1
      required_precommit_fields:
        - dataset_ids
        - holdout_slots
        - systems
        - run_count
        - scorer
        - metric_gate_sha256
        - profile_sha256
        - hardware_fingerprint
        - thread_policy_sha256
        - release
      required_systems: [ours, glim, fast_livo2]
      run_count: 3
      release: Release
      gt_manifest:
        identity_only: true
        allowed_fields:
          - slot_id
          - sequence
          - ground_truth_sha256
          - ground_truth_size_bytes
          - hash_kind
        forbidden_fields:
          - ground_truth_path
          - ground_truth_url
          - ground_truth_uri
          - ground_truth_content
          - decoded_ground_truth
      role_separation:
        replay_role: replay_only
        scoring_role: scoring_only
        distinct_process_identities: true
        runner_gt_mount_forbidden: true
      scoring:
        exactly_one_authorized_event_per_sealed_bundle: true
        explicit_invalidation_allowed: true
        overwrite_or_retry_forbidden: true
      leakage_audit:
        require_prior_gt_access_false: true
        require_development_tuning_false: true
        require_result_dependent_selection_false: true
        require_reused_holdout_false: true
        require_partition_disjointness: true
      external_attestation:
        required: true
        status: NOT_READY
        requirement: independent_custodian_signature_over_sealed_authorization_chain
