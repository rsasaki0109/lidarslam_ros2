competitive_slam_profile:
  schema_version: 1
  name: competitive_slam_v1
  profile_revision_id: competitive-slam-v1-2026-08-r2
  frozen_on: '2026-07-14'
  repetitions: 3
  excluded_capabilities:
    - saved_map_loading
    - localization_mode
    - relocalization
  execution_contract:
    same_bag_bytes: true
    same_sensor_messages: true
    same_bag_bytes_scope: identical_within_each_ros_representation_and_all_repetitions
    cross_ros_representation_policy: canonical_deserialized_message_digest
    require_cross_ros_topic_counts_equal: true
    require_cross_ros_record_timestamps_equal: true
    require_cross_ros_all_sensor_fields_equal: true
    ignored_cross_ros_transport_fields: [std_msgs/Header.seq]
    same_calibration: true
    same_machine: true
    same_alignment_policy: true
    hash_all_inputs: true
    report_failed_runs: true
    unknown_metrics_must_be_omitted: true
  runtime_policy:
    playback_rate: 1.0
    # M6a10 primary gate.  The interval begins only after implementation
    # startup and input-consume readiness, and ends after the required input
    # drain.  Save/postprocess/fixed shutdown grace/container startup are not
    # included.  A wrapper without a complete coverage proof is invalid.
    gate_metric: runtime.online_compute_rtf
    gate_definition: input_consume_start_to_required_drain_end_divided_by_sensor_duration
    maximum_online_compute_rtf: 1.0
    phase_contract_version: m6a10-online-compute-v1
    phase_contract_schema_version: 1
    require_no_input_drops: true
    require_no_queue_overflow: true
    require_complete_input_coverage: true
    exclude_runner_startup_shutdown: true
    exclude_container_startup: true
    exclude_map_save_postprocess: true
    exclude_fixed_shutdown_grace: true
    legacy_wall_gate_metric: runtime.processing_realtime_factor
    legacy_wall_gate_definition: processing_wall_time_divided_by_sensor_duration
    legacy_wall_gate_role: diagnostic_only
    replay_wall_realtime_factor_is_diagnostic_only: true
    maximum_trajectory_end_gap_seconds: 0.25
    # M6a10-v2 replaces wall-RTF-as-followability with an explicit consumer
    # acknowledgement contract.  Thresholds are preregistered before the
    # next training replay: exact counts/EOF/empty drain are hard requirements;
    # 250 ms covers the existing timestamp-coverage bound and a bounded
    # callback tail without turning wall time into the paced primary metric.
    phase_contract_v2:
      schema_version: 2
      version: m6a10-online-compute-v2
      primary_modes: [paced_1x, unpaced_ack]
      paced_primary_metric: runtime.paced_followability_passed
      unpaced_primary_metric: runtime.unpaced_throughput_gate_passed
      maximum_unpaced_throughput_rtf: 1.0
      maximum_timestamp_end_gap_seconds: 0.25
      maximum_callback_latency_seconds: 0.25
      maximum_backlog_messages: 0
      require_exact_consumer_counts: true
      require_eof_observed: true
      require_zero_dropped_messages: true
      require_zero_queue_overflow: true
      require_empty_drain_backlog: true
      require_ack_backpressure_for_unpaced: true
      publisher_counts_are_not_consumer_acks: true
      wall_rtf_role: diagnostic_only
      source:
        path: scripts/benchmark_phase_contract.py
        sha256: d601a89d1cdc6b6d90483005a65c71e6f9b0a6171bccab2085dcec83eac2dfe7
      shell_bridge:
        path: scripts/container_phase_evidence.sh
