schema_version: 1
selection_id: ntu-viral-historical-selection-2026-08-v1
status: NOT_READY
family_id: ntu_viral
partition: historical
selection_basis: >-
  Three officially named sequences are precommitted before acquisition to span
  materially different NTU VIRAL environments: an outdoor carpark (eee_01), an
  indoor auditorium (nya_01), and a building facade (spms_01).  tnp_01 is
  explicitly development/training-exposed by existing m6a10 work and is not an
  evaluation or fresh sequence.
official_sources:
  project_url: https://ntu-aris.github.io/ntu_viral_dataset/
  dataset_repository_url: https://github.com/ntu-aris/ntu_viral_dataset
  ground_truth_repository_url: https://github.com/ntu-aris/ntuviral_gt
  evaluation_tutorial_url: https://ntu-aris.github.io/ntu_viral_dataset/evaluation_tutorial.html
  terms_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  license_id: CC-BY-NC-SA-4.0
  citation: >-
    Nguyen, Thien-Minh, Shenghai Yuan, Muqing Cao, Yang Lyu, Thien Hoang
    Nguyen, and Lihua Xie. NTU VIRAL: A Visual-Inertial-Ranging-Lidar Dataset,
    From an Aerial Vehicle Viewpoint. The International Journal of Robotics
    Research 41(3), 270-280, 2022.
  download_reference_status: MOVING_OFFICIAL_REFERENCE
acquisition:
  recipe_id: ntu-viral-official-materialization-v1
  recipe_revision: preacquisition-metadata-only-2026-08
  materialization: >-
    Resolve the official sequence archive into a canonical read-only bag and
    metadata/calibration tree, retain the official GT-in-bag or ntuviral_gt CSV
    as a separate identity, then record SHA-256 and byte size for every role.
  status: NOT_READY
  required_before_execution:
    - input_sha256
    - input_size_bytes
    - ground_truth_sha256
    - ground_truth_size_bytes
    - calibration_sha256
    - calibration_size_bytes
    - recorded_and_revalidated_mount_identity
    - immutable_source_revision_or_archive_digest
    - all_system_runner_support_receipt
  evidence_mount:
    path: /media/sasaki/aiueo1
    uuid: 3b5dc9b7-c4de-4cf2-a892-00b2c063f34e
    filesystem: ext4
    label: aiueo
    require_rw: true
  candidate_root_relative: datasets/ntu_viral_candidates/ntu-viral-historical-selection-2026-08-v1
  calibration_roles:
    calib_stereo:
      url: null
      official_primary: true
      allowed_hosts: [researchdata.ntu.edu.sg, entuedu-my.sharepoint.com]
      expected_filename: null
      archive: true
      expected_member_paths: []
    calib_stereo_imu:
      url: null
      official_primary: true
      allowed_hosts: [researchdata.ntu.edu.sg, entuedu-my.sharepoint.com]
      expected_filename: null
      archive: false
      expected_member_paths: []
selected_sequences:
