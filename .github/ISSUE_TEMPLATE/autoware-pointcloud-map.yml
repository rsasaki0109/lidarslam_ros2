name: Autoware Pointcloud Map Issue
description: Report a problem in the pointcloud-map path used by Autoware.
title: "[Autoware Map] "
labels:
  - autoware
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this template for issues in the pointcloud-only Autoware flow.
        Include the verifier output and the exact staging/viewer command.
        Do not upload a map bundle, pointcloud tiles, a rosbag, precise
        projector coordinates, or screenshots that reveal a private place.

  - type: input
    id: environment
    attributes:
      label: ROS 2 / Ubuntu / Autoware environment
      description: Include distro, Ubuntu version, and how Autoware was provided.
      placeholder: Jazzy / Ubuntu 24.04 / autoware_core checkout
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command shape
      description: Paste the staging, smoke, or viewer command with credentials, private paths, and precise locations replaced by explicit REDACTED placeholders. Preserve every option and non-private value.
      render: bash
    validations:
      required: true

  - type: textarea
    id: verifier
    attributes:
      label: verify_autoware_map output
      description: Review and paste the local verifier result after removing private paths and precise locations.
      render: text
    validations:
      required: true

  - type: dropdown
    id: gnss
    attributes:
      label: GNSS usage
      options:
        - GNSS disabled
        - GNSS enabled
        - Not sure
    validations:
      required: true

  - type: textarea
    id: projector
    attributes:
      label: Projector configuration summary
      description: State projector_type and whether an origin is present. Replace latitude, longitude, altitude, MGRS/grid identifiers, and every precise origin value with REDACTED; never paste the complete map_projector_info.yaml from a private site.
      placeholder: "projector_type: LocalCartesian; map_origin: REDACTED"
      render: text
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what failed or regressed.
      placeholder: RViz opened but /map/pointcloud_map never appeared.
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Privacy-reviewed diagnostics
      description: Attach only a reviewed `lidarslam-map support <session_bundle>` ZIP or separately reviewed non-geometry diagnostics. Do not attach a map bundle, pointcloud/lanelet files, rosbag, raw private log, precise coordinates, or screenshots revealing a private place.
      placeholder: |
        support-<run-id>.zip
        redacted verifier or viewer finding

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and location safety
      options:
        - label: I removed credentials, private paths, precise locations, and every projector-origin coordinate or grid identifier.
          required: true
        - label: I did not attach a rosbag, map bundle, pointcloud/lanelet geometry, raw private log, or screenshot that reveals a private place.
          required: true
        - label: I reviewed every attached file before sharing it, or attached no file.
          required: true
