name: official RKO-LIO binary compatibility

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/official-rko-binary-compatibility.yml
      - configs/real_data_e2e/driving_slam_mid360_v1.json
      - lidarslam/launch/rko_lio_slam.launch.py
      - lidarslam/param/rko_lio_mid360.yaml
      - lidarslam/package.xml
      - scripts/lidarslam_map.py
      - scripts/run_autoware_map_from_bag.py
      - scripts/validate_real_data_e2e.py
  schedule:
    - cron: '37 16 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-rko-binary-compatibility
  cancel-in-progress: false

env:
  RKO_RELEASE_VERSION: 0.3.2-1

jobs:
  pinned-mid360:
    name: ${{ matrix.ros_distro }} official RKO-LIO
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runs_on: ubuntu-22.04
            container: ros:humble-ros-core
          - ros_distro: jazzy
            runs_on: ubuntu-24.04
            container: ros:jazzy-ros-core

    steps:
      - name: Install base dependencies and exact testing candidate
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            git \
            python3-colcon-common-extensions \
            python3-jsonschema \
            python3-rosdep \
            ros2-testing-apt-source \
            tar \
            zstd
          apt-get update

          package="ros-${{ matrix.ros_distro }}-rko-lio"
          candidate="$(
            apt-cache madison "${package}" \
              | awk -v prefix="${RKO_RELEASE_VERSION}" \
                  'index($3, prefix) == 1 {print $3; exit}'
          )"
          if [[ -z "${candidate}" ]]; then
            echo "No ${package} ${RKO_RELEASE_VERSION} testing candidate" >&2
            apt-cache madison "${package}" >&2
            exit 1
          fi
          apt-get install -y "${package}=${candidate}"
          echo "RKO_DEB_VERSION=${candidate}" >> "${GITHUB_ENV}"

      - name: Check out release-shaped source tree
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Fetch only the unreleased NDT dependency
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git submodule update --init Thirdparty/ndt_omp_ros2
          test ! -e Thirdparty/rko_lio/package.xml

      - name: Initialize rosdep
        shell: bash
        run: |
          if [[ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            rosdep init
          fi
          rosdep update --rosdistro "${{ matrix.ros_distro }}"

      - name: Install product dependencies without source RKO-LIO
        shell: bash
        run: |
          source "/opt/ros/${{ matrix.ros_distro }}/setup.bash"
          rosdep install -r -y \
            --from-paths \
              lidarslam \
              lidarslam_msgs \
              scanmatcher \
              graph_based_slam \
              Thirdparty/ndt_omp_ros2 \
            --ignore-src \
            --rosdistro "${{ matrix.ros_distro }}"

      - name: Build product without source RKO-LIO
        shell: bash
        run: |
          source "/opt/ros/${{ matrix.ros_distro }}/setup.bash"
          colcon build \
            --symlink-install \
            --packages-select \
              ndt_omp_ros2 \
              lidarslam_msgs \
              scanmatcher \
              graph_based_slam \
              lidarslam \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF

      - name: Record official binary identity
        shell: bash
        run: |
          source "/opt/ros/${{ matrix.ros_distro }}/setup.bash"
          source install/setup.bash
          prefix="$(ros2 pkg prefix rko_lio)"
          executable="${prefix}/lib/rko_lio/offline_node"
          test "${prefix}" = "/opt/ros/${{ matrix.ros_distro }}"
          test -x "${executable}"
          mkdir -p output/official-rko-compatibility
          RKO_PREFIX="${prefix}" RKO_EXECUTABLE="${executable}" \
            python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          executable = Path(os.environ['RKO_EXECUTABLE'])
          payload = {
              'schema_version': 1,
              'source': 'packages.ros.org/ros2-testing/ubuntu',
              'ros_distro': os.environ['ROS_DISTRO'],
              'deb_version': os.environ['RKO_DEB_VERSION'],
              'package_prefix': os.environ['RKO_PREFIX'],
              'executable': str(executable),
              'executable_sha256': hashlib.sha256(
                  executable.read_bytes()
              ).hexdigest(),
          }
          Path(
              'output/official-rko-compatibility/binary-identity.json'
          ).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Restore pinned dataset archive
        uses: actions/cache@v5
        with:
          path: datasets/real-data-e2e/driving_slam_mid360/archives/rosbag2_2024_04_16-14_17_01.zip
          key: driving-slam-mid360-517088133-0836c50859bb1af591966b69da166186

      - name: Download and verify pinned real bag
        shell: bash
        run: |
          python3 scripts/download_mid360_robot_public_dataset.py \
            --dataset driving_slam_mid360 \
            --dataset-root datasets/real-data-e2e \
            --output-dir output/official-rko-compatibility/intake

      - name: Run installed golden path
        shell: bash
        run: |
          source "/opt/ros/${{ matrix.ros_distro }}/setup.bash"
          source install/setup.bash
          bag="datasets/real-data-e2e/driving_slam_mid360/extracted/rosbag2_2024_04_16-14_17_01/rosbag2_2024_04_16-14_17_01"
          lidarslam-map doctor "${bag}" --json \
            > output/official-rko-compatibility/doctor.json
          timeout --signal=TERM --kill-after=30s 20m \
            lidarslam-map run "${bag}" \
              --output-dir output/official-rko-compatibility/run

      - name: Validate exact-distro E2E evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(
              'configs/real_data_e2e/driving_slam_mid360_v1.json'
          )
          contract = json.loads(source.read_text(encoding='utf-8'))
          distro = os.environ['ROS_DISTRO']
          contract['id'] = f"official_rko_{distro}_mid360_v1"
          contract['execution']['ros_distro'] = distro
          output = Path(
              'output/official-rko-compatibility/e2e-contract.json'
          )
          output.write_text(
              json.dumps(contract, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python3 scripts/validate_real_data_e2e.py \
            --contract output/official-rko-compatibility/e2e-contract.json \
            --intake-manifest datasets/real-data-e2e/driving_slam_mid360/mid360_robot_public_dataset_intake.json \
            --run-dir output/official-rko-compatibility/run \
            --output-json output/official-rko-compatibility/evidence.json \
            --output-markdown output/official-rko-compatibility/evidence.md

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          if [[ -f output/official-rko-compatibility/evidence.md ]]; then
            sed -n '1,120p' \
              output/official-rko-compatibility/evidence.md \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Official RKO-LIO gate produced no E2E report" \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload non-geometry evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: official-rko-${{ matrix.ros_distro }}-compatibility
          retention-days: 30
          if-no-files-found: warn
          path: |
            output/official-rko-compatibility/binary-identity.json
            output/official-rko-compatibility/doctor.json
            output/official-rko-compatibility/e2e-contract.json
            output/official-rko-compatibility/evidence.json
            output/official-rko-compatibility/evidence.md
            output/official-rko-compatibility/run/run_manifest.json
            output/official-rko-compatibility/run/autoware_map_diagnosis.json
            output/official-rko-compatibility/run/autoware_map_diagnosis.md
            output/official-rko-compatibility/run/verify_autoware_map.log
            output/official-rko-compatibility/run/first_map_validation_receipt.json
            output/official-rko-compatibility/run/first_map_validation_receipt.md
            output/official-rko-compatibility/run/slam.launch.log
            output/official-rko-compatibility/run/map_save.log
